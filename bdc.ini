; Ejemplo de BDC.INI
; Se lee de la misma carpeta en la que está el ejecutable.

[principal]
; Editor con el que se escriben las notas. Puede llevar argumentos.
; Los editores gráficos deben esperar a que se cierre el fichero:
;   VS Code:    code --wait
;   Notepad++:  "C:\Program Files\Notepad++\notepad++.exe" -multiInst -nosession
; Si no se indica se usa la variable VISUAL o EDITOR, o el del sistema
; (notepad en Windows, nano o vi en Linux).
editor=code --wait

[base_de_datos]
; Ruta completa al fichero de base de datos SQLite.
; Si no se especifica, se usa bdc.db junto al ejecutable.
; Se puede establecer con: bdc -bd FICHERO
;ruta=C:\Users\usuario\Documents\bdc.db
ruta=/home/usuario/Documentos/bdc/bdc.db
